name: Release binaries

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'scripts/**'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate release version
        run: python scripts/release.py version --tag "$RELEASE_TAG"
      - name: Install native musl build tools and Rust
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1
          rustup target add "$RELEASE_TARGET"
      - name: Test portable target
        run: cargo test --locked --all-targets --target "$RELEASE_TARGET"
      - name: Build release binary
        run: cargo build --locked --release --target "$RELEASE_TARGET"
      - name: Package and smoke-test static binary
        run: python scripts/release.py bundle --target "$RELEASE_TARGET" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: rdp-tui-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: rdp-tui-*
          merge-multiple: true
          path: dist
      - name: Publish verified release assets
        run: bash scripts/publish-release.sh
