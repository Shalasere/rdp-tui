[package]
name = "rdp-tui"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.93"
description = "Keyboard-driven FreeRDP profile manager"
license = "MIT"
repository = "https://github.com/Shalasere/rdp-tui"

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
fs2 = "0.4.3"
getrandom = "0.4.2"
regex = "1.13.1"
ratatui = "0.30.2"
rustix = { version = "1.1.4", features = ["fs", "process", "pipe"] }
secrecy = "0.10.3"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
toml = "1.1.4"

[dev-dependencies]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
